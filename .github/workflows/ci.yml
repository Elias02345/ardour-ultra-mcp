name: Python and MCP
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[analysis,dev]"
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: mypy src
      - run: python scripts/generate_reference.py --check
      - run: pytest --cov=ardour_ultra_mcp --cov-branch --cov-fail-under=80 --cov-report=xml --junitxml=tests.xml
      - run: bandit -r src
      - run: pip-audit
      - run: python -m build
      - run: ardour-ultra-mcp doctor --backend fake --json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.os }}-${{ matrix.python }}
          path: |
            coverage.xml
            tests.xml
            dist/*
  linux-ardour:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y ardour xvfb
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[analysis,dev]"
      - name: Actual installed Ardour common bindings
        shell: bash
        run: |
          exe=$(find /usr/lib -path '*/ardour*/luasession' -type f | head -n 1)
          test -n "$exe"
          ardour_lib=$(dirname "$exe")
          ardour_flavor=$(basename "$ardour_lib")
          ARDOUR_LUA_PATH="$exe" LD_LIBRARY_PATH="$ardour_lib" ARDOUR_DLL_PATH="$ardour_lib" ARDOUR_DATA_PATH="/usr/share/$ardour_flavor" ARDOUR_CONFIG_PATH="/etc/$ardour_flavor" LV2_PATH="$ardour_lib/LV2:/usr/lib/lv2" python scripts/run_ardour_e2e.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-linux-ardour
          path: artifacts/ardour-*
